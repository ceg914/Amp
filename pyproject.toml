[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amp-vocal-transcriber"
version = "0.1.0"
description = "MP3 보컬 자동 채보 및 피아노 롤 편집기 (개발 중)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.24",
    "soundfile>=0.12.1",
]

[project.optional-dependencies]
mp3-fallback = ["miniaudio>=1.59"]
dev = ["pytest>=7.4", "pytest-qt>=4.2"]

[project.gui-scripts]
amp = "amp.app.main:main"

[tool.setuptools.packages.find]
include = ["amp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"
