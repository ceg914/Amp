[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonatlas"
version = "0.2.0"
description = "SONATLAS: 보컬 분리·자동 채보·피아노 롤 편집기 (개발 중)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.24",
    "soundfile>=0.12.1",
    "scipy>=1.10",
    "librosa>=0.10.2",
]

[project.optional-dependencies]
mp3-fallback = ["miniaudio>=1.59"]
separation = ["demucs>=4.1,<5"]  # PyTorch는 scripts/install_separation.py로 GPU에 맞춰 설치
dev = ["pytest>=7.4", "pytest-qt>=4.2"]

[project.gui-scripts]
sonatlas = "amp.app.main:main"

[tool.setuptools.packages.find]
include = ["amp*"]

[tool.setuptools.package-data]
"amp.app.theme" = ["fonts/*", "icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"
